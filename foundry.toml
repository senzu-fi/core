[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
auto_detect_remappings = false
remappings = [
  "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@uniswap/v3-core/=lib/v3-core/",
  "@uniswap/v3-periphery/=lib/v3-periphery/",
  "@uniswap/v4-core/=lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "forge-std/=lib/forge-std/src/",
  "permit2/=lib/permit2/",
  "solady/=lib/solady/src/",
]
solc = "0.8.39"
evm_version = "cancun"   # transient storage for lock()
optimizer = true
optimizer_runs = 49_999
via_ir = true
bytecode_hash = "none"
gas_limit = 60_000_000_000
disable_block_gas_limit = true
ignored_error_codes = [2394, 3860]
ignored_warnings_from = ["script", "test/invariant"]
# SenzuPreviews is never deployed (the vectors' reference) and is over 24 KB at 49,999 runs
additional_compiler_profiles = [{ name = "10k", optimizer_runs = 10_000 }]
compilation_restrictions = [{ paths = "src/periphery/SenzuPreviews.sol", max_optimizer_runs = 10_000 }]
fs_permissions = [{ access = "read-write", path = "./formal/vectors" }]

# Solar for local dev
[profile.solar]
solc = "solar"
out = "out-solar"
cache_path = "cache-solar"

# `FOUNDRY_PROFILE=slither slither .`: slither builds src/ only
[profile.slither]
out = "out-slither"
cache_path = "cache-slither"

[fuzz]
runs = 1000

[invariant]
runs = 32
depth = 50
fail_on_revert = false

# A longer campaign: FOUNDRY_PROFILE=deep forge test --match-contract HubInvariantTest
[profile.deep.invariant]
runs = 256
depth = 100
fail_on_revert = false

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
sort_imports = true
ignore = ["src/interfaces/external/pyth/**"]
